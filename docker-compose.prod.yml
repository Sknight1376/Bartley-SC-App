services:
  db:
    ports: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.production}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - entrypoint:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  web:
    build:
      context: app
      target: production
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env.production}
      SECRET_KEY: ${SECRET_KEY:?set in .env.production}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: "Lax"
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-db-volume:
  entrypoint:
