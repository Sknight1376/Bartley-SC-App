<!DOCTYPE html>
<html lang="en">
<head>
  <script src="static/js/jquery-3.6.3.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static',filename='styles/styles.css') }}">
  <style>
    .series-wrap { width: 990px; margin: 20px auto; }
    .series-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .series-card h3 { margin: 0 0 12px; color: #1331C5; }
    .row { display:flex; gap:12px; align-items:end; }
    .field { flex:1; }
    .field label { display:block; font-size:13px; margin-bottom:4px; color:#444; }
    .field input { width:100%; height:36px; border:1px solid #d0d0d0; border-radius:6px; padding:0 10px; }
    .btn { background:#1331C5; color:#fff; border:0; border-radius:6px; height:36px; padding:0 14px; cursor:pointer; }
    .btn.secondary { background:#6b7280; }
    .series-table { width:100%; border-collapse: collapse; background:#fff; }
    .series-table th { background:#e0e0e0; padding:8px 10px; border-bottom:2px solid #d0d0d0; text-align:left; }
    .series-table td { padding:8px 10px; border-bottom:1px solid #ececec; }
    .small-input { height:30px; border:1px solid #d0d0d0; border-radius:6px; padding:0 8px; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .sub-card { border:1px solid #e8e8e8; border-radius:8px; padding:12px; background:#fafafa; }
    .sub-card h4 { margin:0 0 10px; color:#1331C5; }
    .mini-table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
    .mini-table th, .mini-table td { border-bottom:1px solid #eee; padding:6px 8px; text-align:left; }
    .hidden { display:none; }
    .form-group { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
    .form-group label { font-size:12px; font-weight:600; color:#333; }
    .form-group input, .form-group select { width:100%; }
    .form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
  </style>
</head>
<body>

<div class="lettering" onclick="window.location.href='/landing'" style="cursor:pointer;">QuickSail</div>
<section class="banner"></section>
<br>

<div class="form-border" style="text-align:center;">
  <h4 style="color:#979797">Club Administration</h4>
  <h2>Series Management</h2>
  <h4 style="color:#979797">{{ clubName }}</h4>
</div>

<div class="series-wrap">
  <div class="series-card">
    <div class="row" style="justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">Series List</h3>
      <button class="btn" onclick="window.location.href='/series/new/start'">Add New Series</button>
    </div>
    <div style="font-size:12px; color:#666; margin-top:8px;">
      Series setup (schedule, exceptions and scoring) is now managed on a dedicated page.
    </div>
  </div>

  <table class="series-table">
    <thead>
      <tr>
        <th style="width:40%;">Series Name</th>
        <th style="width:14%;">Year</th>
        <th style="width:12%;">Races</th>
        <th style="width:20%;">Next Race</th>
        <th style="width:14%;">Actions</th>
      </tr>
    </thead>
    <tbody id="seriesBody"></tbody>
  </table>
</div>

<div class="form-footer" style="display:flex; justify-content:center; gap:20px;">
  <button class="blue-button" onclick="window.location.href='/landing'">Back to Landing</button>
</div>

<script>
let seriesRows = [];

function esc(v) {
  return String(v ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

async function loadSeries() {
  const res = await fetch('/api/series/manage', { cache: 'no-store' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.ok) {
    throw new Error(data.error || 'Failed to load series');
  }
  seriesRows = data.series || [];
  renderSeries();
}

function renderSeries() {
  const tbody = document.getElementById('seriesBody');
  tbody.innerHTML = '';

  seriesRows.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(s.name)}</td>
      <td>${esc(s.year)}</td>
      <td>${esc(s.total_races ?? 0)}</td>
      <td>${esc(s.next_race_at ?? '-')}</td>
      <td>
        <button class="btn" onclick="openSeriesSetup(${s.key})">Edit Setup</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  if (seriesRows.length === 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="5" style="color:#888;">No series created yet.</td>';
    tbody.appendChild(tr);
  }
}

function openSeriesSetup(seriesId) {
  window.location.href = `/series/new/schedule?series_id=${seriesId}`;
}

(async function init() {
  try {
    await loadSeries();
  } catch (e) {
    alert(e.message || 'Failed to load page');
  }
})();
</script>

</body>
</html>
