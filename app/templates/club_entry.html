<!DOCTYPE html>
<html lang="en">
<head>
  <script src="static/js/jquery-3.6.3.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static',filename='styles/styles.css') }}">
</head>
<body>

<div class="lettering">QuickSail</div>


<section class="banner">
</section>

  <br>

<div class = "form-border">
    <div class = "entry-banner">
    <div style="background-image: linear-gradient(to right, #D7D9FD, #A9ADFC); border-top-right-radius: 120px; border-bottom-right-radius: 120px; color: #ffffff; text-align: center; line-height: 40px;">1. Entry</div>
    <div style="color: #979797; text-align: center; line-height: 40px;">2. Sailor</div>
    <div style="color: #979797; text-align: center; line-height: 40px;">3. Summary</div>
    </div>
    <br>
<h4 style="color: #979797">Step One</h4>
<h2>Club Details</h2>
<h4 style="color: #979797">Find the correct club and series for your race</h4>
  <form class="form-inline">
    <div style="vertical-align: middle; padding-left: 110px; padding-right: 110px;">
    <label for="clubName" style = "color: black;">Club</label>
      <select id="clubName" aria-label="Select club"></select>

    <!-- <datalist id="clubNameList"></datalist> -->
    </div>

    <div style="vertical-align: middle;">
    <label for="clubName" style = "color: black;">Series</label>
    <select id="seriesName" aria-label="Select series" disabled>
    </select>

    </div>
  </form>
</div>
<div class = form-footer>
  <button id="nextButton" class="blue-button" disabled>> Boat and Sailor details</button>
</div>

<script type="text/javascript" src="{{ url_for('static', filename='js/main.js')}}"></script>

<script type="text/javascript"></script>

<Script>
  document.addEventListener("DOMContentLoaded", async () => {
    // 1) Load primary dropdown (CLUBS)
    await loadPrimaryDropdown("#clubName", "/api/clubs",
        data => data.clubs,
        {
            valueField: "id",
            labelField: "name",
            placeholder: "Select a club…"
        }
    );

    // 2) Wire Club → Series dependency
    createDependentDropdown("#clubName", "#seriesName", {
        url: (clubId) => `/api/series/${clubId}`,
        extract: (data) => data.series,
        valueField: "id",
        labelField: "name",
        placeholder: "Select a series…"
    });
});
</Script>

<script>
  

document.addEventListener("DOMContentLoaded", () => {
    
    // Your existing loaders:
    // loadPrimaryDropdown(...)
    // createDependentDropdown(...)

    // Enable Next button only when required selects are chosen
    enableButtonWhenAllSelected("#nextButton", [
        "#clubName",
        "#seriesName"
    ]);

    // On click: go to next page
    document.querySelector("#nextButton").addEventListener("click", async () => {
        const clubSelect = document.querySelector("#clubName");
        const seriesSelect = document.querySelector("#seriesName");
        const selectedClubId = clubSelect.value;
        const selectedSeriesId = seriesSelect.value;

        if (!selectedClubId || !selectedSeriesId) {
            alert('Please select club and series');
            return;
        }

        // Set sessionStorage
        sessionStorage.setItem('club', selectedClubId);
        sessionStorage.setItem('series', selectedSeriesId);

        // Set server session
        try {
            const res = await fetch('/api/set_club_series', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ club_id: selectedClubId, series_id: selectedSeriesId })
            });
            if (!res.ok) {
                alert('Failed to set session');
                return;
            }
        } catch (e) {
            alert('Error setting session');
            return;
        }

        const params = new URLSearchParams();
        params.append("clubName", selectedClubId);
        params.append("seriesName", selectedSeriesId);

        window.location.href = `/sailor_entry?${params.toString()}`;
    });
});


enableButtonWhenAllSelected("#nextButton", [
    "#clubName",
    "#seriesName",
    "#boatSelect",
    "#laneSelect"
]);

</script>

</body>
</html>
