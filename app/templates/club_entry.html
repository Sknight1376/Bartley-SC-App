<!DOCTYPE html>
<html lang="en">
<head>
  <script src="static/js/jquery-3.6.3.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static',filename='styles/styles.css') }}">
</head>
<body>

<div class="lettering" onclick="window.location.href='/landing'" style="cursor:pointer;">QuickSail</div>


<section class="banner">
</section>

  <br>

<div class = "form-border">
    <div class = "entry-banner">
    <div style="background-image: linear-gradient(to right, #D7D9FD, #A9ADFC); border-top-right-radius: 120px; border-bottom-right-radius: 120px; color: #ffffff; text-align: center; line-height: 40px;">1. Entry</div>
    <div style="color: #979797; text-align: center; line-height: 40px;">2. Sailor</div>
    <div style="color: #979797; text-align: center; line-height: 40px;">3. Summary</div>
    </div>
    <br>
<h4 style="color: #979797">Step One</h4>
<h2>Club Details</h2>
<h4 style="color: #979797">Your club is identified from login. Select the specific upcoming race (next available per active series).</h4>
  <form class="form-inline">
    <div style="vertical-align: middle; padding-left: 110px; padding-right: 110px; width:100%;">
      <label style="color: black;">Club</label>
      <div id="clubNameDisplay" style="padding:10px 12px; border:1px solid #d0d0d0; border-radius:6px; background:#f7f8ff;">
        {{ clubName or 'Unknown Club' }}
      </div>
    </div>

    <div style="vertical-align: middle;">
    <label for="raceName" style = "color: black;">Upcoming Race</label>
    <select id="raceName" aria-label="Select race" disabled>
    </select>

    </div>
  </form>
</div>
<div class = form-footer>
  <button id="nextButton" class="blue-button" disabled>> Boat and Sailor details</button>
</div>

<script type="text/javascript" src="{{ url_for('static', filename='js/main.js')}}"></script>

<script type="text/javascript"></script>

<Script>
  document.addEventListener("DOMContentLoaded", async () => {
    const clubId = {{ clubId | tojson }};

    // Load next race in each active series for logged-in club
    await loadPrimaryDropdown("#raceName", `/api/races/upcoming/${clubId}`,
      data => (data.races || []).map(r => ({
        id: { race_id: r.race_id, series_id: r.series_id },
        name: `${r.series_name} - Race ${r.race_no} (${r.started_at || 'No date'})`
      })),
      {
        valueField: "id",
        labelField: "name",
        placeholder: "Select an upcoming race…"
      }
    );
  });
</Script>

<script>
  

document.addEventListener("DOMContentLoaded", () => {
  const clubId = {{ clubId | tojson }};
    
    // Enable Next button only when required selects are chosen
    enableButtonWhenAllSelected("#nextButton", [
      "#raceName"
    ]);

    // On click: go to next page
    document.querySelector("#nextButton").addEventListener("click", async () => {
      const raceSelect = document.querySelector("#raceName");
      const selectedClubId = clubId;
      const selectedRaceValue = raceSelect.value;
      let selectedRace = null;
      try {
        selectedRace = JSON.parse(selectedRaceValue || "{}");
      } catch (e) {
        selectedRace = null;
      }
      const selectedSeriesId = selectedRace?.series_id;
      const selectedRaceId = selectedRace?.race_id;

      if (!selectedClubId || !selectedSeriesId || !selectedRaceId) {
        alert('Please select an upcoming race');
            return;
        }

        // Set sessionStorage
        sessionStorage.setItem('club', selectedClubId);
        sessionStorage.setItem('series', selectedSeriesId);
        sessionStorage.setItem('race_id', selectedRaceId);

        // Set server session
        try {
            const res = await fetch('/api/set_club_series', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ club_id: selectedClubId, series_id: selectedSeriesId, race_id: selectedRaceId })
            });
            if (!res.ok) {
                alert('Failed to set session');
                return;
            }
        } catch (e) {
            alert('Error setting session');
            return;
        }

        const params = new URLSearchParams();
        params.append("clubName", selectedClubId);
        params.append("seriesName", selectedSeriesId);
        params.append("raceId", selectedRaceId);

        window.location.href = `/sailor_entry?${params.toString()}`;
    });
});


enableButtonWhenAllSelected("#nextButton", [
  "#raceName"
]);

</script>

</body>
</html>
