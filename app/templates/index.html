<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Entry Setup</title>
  <script src="static/js/jquery-3.6.3.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static',filename='styles/styles.css') }}">
</head>
<body class="landing-page">
  <header class="banner" role="banner">
    <h1 class="sr-only">Race Entry Setup</h1>
  </header>

  <main class="page-shell">
    <div class="form-border" aria-labelledby="entrySetupHeading">
      <h2 id="entrySetupHeading" class="lettering">Set up race entries</h2>

      <div class="entry-banner" aria-label="Progress steps">
        <div class="entry-step entry-step-active" aria-current="step">1. Entry</div>
        <div class="entry-step">2. Sailor</div>
        <div class="entry-step">3. Summary</div>
      </div>

      <div id="formStatus" class="status-banner" role="status" aria-live="polite" hidden></div>

      <form class="club" novalidate>
        <label for="clubName">Club</label>
        <input type="text" id="clubName" list="clubNameList" autocomplete="off" required>
        <datalist id="clubNameList"></datalist>

        <label for="seriesName">Series</label>
        <input type="text" id="seriesName" required>
      </form>

      <form class="competitors" novalidate>
        <label for="Boat">Boat</label>
        <select id="Boat" required></select>

        <label for="sailNo">Sail Number</label>
        <input type="text" id="sailNo" required>
      </form>
    </div>

    <div class="action-row">
      <button type="button" id="addEntry" class="orange-button">Add Entry</button>
      <button type="button" id="goRace" class="green-button">Go to Race</button>
    </div>

    <div class="table-wrap">
      <table id="setupEntries" class="tables" aria-describedby="entriesHelp">
        <caption id="entriesHelp" class="sr-only">Current race entries list</caption>
        <thead>
          <tr>
            <th scope="col">Boat</th>
            <th scope="col">Sail Number</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    const boats = {{ boatarray | tojson }};
    const boatSelect = document.getElementById("Boat");
    const statusNode = document.getElementById("formStatus");
    boatSelect.add(new Option("-- Select a boat --", ""));
    for (const [name, id] of boats) {
      boatSelect.add(new Option(name, id));
    }

    const entries = [];

    function setStatus(message, type = "info") {
      statusNode.textContent = message;
      statusNode.className = `status-banner status-${type}`;
      statusNode.hidden = !message;
    }

    function renderEntries() {
      const tbody = document.querySelector("#setupEntries tbody");
      tbody.innerHTML = "";

      if (!entries.length) {
        const emptyRow = document.createElement("tr");
        emptyRow.innerHTML = `<td colspan="3" class="empty-table">No entries added yet.</td>`;
        tbody.appendChild(emptyRow);
        return;
      }

      entries.forEach((e, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${e.boatName}</td>
          <td>${e.sailNo}</td>
          <td><button type="button" class="red-button remove-entry" data-idx="${idx}">Remove</button></td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll("button[data-idx]").forEach(btn => {
        btn.addEventListener("click", () => {
          const i = Number(btn.getAttribute("data-idx"));
          entries.splice(i, 1);
          setStatus("Entry removed.", "info");
          renderEntries();
        });
      });
    }

    async function loadClubs() {
      const res = await fetch("/api/clubs");
      if (!res.ok) {
        setStatus("Unable to load clubs right now.", "error");
        return;
      }
      const data = await res.json();
      const list = document.getElementById("clubNameList");
      list.innerHTML = "";
      (data.clubs || []).forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        list.appendChild(opt);
      });
    }

    function isValidSetup(clubName, seriesName) {
      if (!clubName) {
        setStatus("Please enter a club name.", "error");
        return false;
      }
      if (!seriesName) {
        setStatus("Please enter a series name.", "error");
        return false;
      }
      if (!entries.length) {
        setStatus("Add at least one entry before continuing.", "error");
        return false;
      }
      return true;
    }

    document.getElementById("addEntry").addEventListener("click", () => {
      const boatId = boatSelect.value;
      const boatName = boatSelect.options[boatSelect.selectedIndex]?.text;
      const sailNo = document.getElementById("sailNo").value.trim();

      if (!boatId) {
        setStatus("Select a boat.", "error");
        return;
      }
      if (!sailNo) {
        setStatus("Enter a sail number.", "error");
        return;
      }

      entries.push({ boatId: Number(boatId), boatName, sailNo });
      setStatus("Entry added.", "success");
      renderEntries();
      document.getElementById("sailNo").value = "";
    });

    document.getElementById("goRace").addEventListener("click", () => {
      const clubName = document.getElementById("clubName").value.trim();
      const seriesName = document.getElementById("seriesName").value.trim();

      if (!isValidSetup(clubName, seriesName)) return;

      sessionStorage.setItem("clubName", clubName);
      sessionStorage.setItem("seriesName", seriesName);
      sessionStorage.setItem("entries", JSON.stringify(entries));

      window.location.href = "/race";
    });

    $(function(){
      $(':text').on('keydown', function(e){
        if(e.keyCode === 13) e.preventDefault();
      });
    });

    document.addEventListener("DOMContentLoaded", () => {
      loadClubs();
      renderEntries();
    });
  </script>
</body>
</html>
