<!DOCTYPE html>
<html lang="en">
<head>
  <title>ClubHub Login | SailingHub</title>
  <script src="static/js/jquery-3.6.3.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static',filename='styles/styles.css') }}">
</head>
<body>

<div class="lettering" onclick="window.location.href='/landing'" style="cursor:pointer;">ClubHub</div>
<section class="banner"></section>
<br>

<div class="form-border">
  <h4 style="color: #979797">Welcome to ClubHub</h4>
  <h2>Secure Login</h2>
  <h4 style="color: #979797">by SailingHub</h4>

  <form class="form-inline">
    <div style="vertical-align: middle; padding-left: 110px; padding-right: 110px; width:100%;">
      <label for="username" style="color:black;">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="Enter username" style="width:100%; height:40px; padding:0 10px; border:1px solid #d0d0d0; border-radius:6px;">
      <br><br>
      <label for="password" style="color:black;">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" style="width:100%; height:40px; padding:0 10px; border:1px solid #d0d0d0; border-radius:6px;">
    </div>
  </form>
</div>

<div class="form-footer">
  <button id="loginBtn" class="blue-button" disabled>Login</button>
</div>

<script type="text/javascript" src="{{ url_for('static', filename='js/main.js')}}"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');

  function updateLoginState() {
    loginBtn.disabled = !(usernameInput.value.trim() && passwordInput.value.trim());
  }
  usernameInput.addEventListener('input', updateLoginState);
  passwordInput.addEventListener('input', updateLoginState);
  updateLoginState();

  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !loginBtn.disabled) {
      loginBtn.click();
    }
  });

  loginBtn.addEventListener('click', async () => {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || !password) {
      alert('Please enter username and password');
      return;
    }

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Login failed');
        return;
      }

      const data = await res.json();
      sessionStorage.setItem('club', data.club_id);
      sessionStorage.setItem('clubName', data.club_name || '');
      sessionStorage.setItem('username', data.username || '');
      window.location.href = '/landing';
    } catch (e) {
      alert('Error during login');
    }
  });
});
</script>
</body>
</html>
